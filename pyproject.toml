[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-tta"
version = "0.1.0"
description = "DeepFakeBench corruption generation, CLIP feature extraction, and Tip-Adapter evaluation."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "torch",
  "scikit-learn",
  "tqdm",
  "Pillow",
  "opencv-python",
  "open_clip_torch",
]

[project.scripts]
deepfake-tta = "deepfake_tta.cli:main"
